<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcb33"/>
      <stop offset="100%" stop-color="#c98a00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- $ symbol -->
  <g transform="translate(256, 256)">
    <circle r="160" fill="none" stroke="url(#gold)" stroke-width="14" opacity="0.3"/>
    <text x="0" y="38" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-weight="900" font-size="220" fill="url(#gold)">$</text>
  </g>
  <!-- Korean accent -->
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="44" fill="#787b86">ONLY MONEY</text>
</svg>
